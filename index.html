<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- FIX: Ensures mobile browsers render 1:1 scale on web hosts like GitHub Pages -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zest+</title>
    <style>
        /* Mobile-First Layout Reset & Responsive Override Fix */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }

        /* Enforces full width on mobile while remaining clean on desktop screens */
        .app-container {
            width: 100%;
            max-width: 500px; /* Mobile app container view */
            margin: 0 auto;
            min-height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        }

        header {
            background-color: #4a90e2;
            color: #ffffff;
            padding: 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        main {
            flex: 1;
            padding: 1rem;
        }

        .card {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: #ffffff;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .btn:active {
            background-color: #357abd;
        }

        footer {
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #6c757d;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Zest+</h1>
        </header>

        <main>
            <div class="card">
                <h2>Welcome to Zest+</h2>
                <p>Your privacy-first, local health tracking app.</p>
                <button class="btn" onclick="alert('App initialized successfully!')">Get Started</button>
            </div>
        </main>

        <footer>
            <p>&copy; Zest+ — Local-first Data Storage</p>
        </footer>
    </div>

</body>
</html>
